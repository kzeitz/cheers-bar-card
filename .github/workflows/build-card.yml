name: Build Bar Card

# Tests the handicap math, builds index.html from source/card, and publishes the site.
# If the math test fails, nothing is published and the live card stays as it was.
on:
  push:
    branches: [main]
    paths:
      - 'source/card/**'
      - '.github/workflows/build-card.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Math test
        run: |
          out=$(node source/card/test_calc.js)
          echo "$out"
          case "$out" in PASS*) ;; *) echo "Math test failed - not publishing"; exit 1;; esac
      - name: Build index.html
        run: python source/card/build_card.py
      - name: Package site
        run: |
          mkdir _site
          cp index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
